name: Build AstraOS ARM64 Live Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install compiler, ISO, and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld xorriso dosfstools mtools qemu-system-arm qemu-efi-aarch64 file

      - name: Run sanitized VFS tests and build the kernel and images
        run: bash ./scripts/build.sh

      - name: Inspect kernel and ISO
        run: |
          file build/kernel.elf
          file build/iso-root/EFI/BOOT/BOOTAA64.EFI
          xorriso -indev build/astraos-aarch64.iso -report_el_torito as_mkisofs
          test -s build/astraos-aarch64.iso
          test -s build/astraos-aarch64-esp.img
          sha256sum -c build/SHA256SUMS --ignore-missing

      - name: Smoke-test kernel boot in QEMU UEFI
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(find /usr/share -name 'AAVMF_CODE.fd' -print -quit)"
          VARS_TEMPLATE="$(find /usr/share -name 'AAVMF_VARS.fd' -print -quit)"
          if [[ -z "$CODE" || -z "$VARS_TEMPLATE" ]]; then
            echo "Could not find AArch64 UEFI firmware files." >&2
            find /usr/share -iname '*AAVMF*' -o -iname '*QEMU_EFI*' | head -50
            exit 1
          fi
          cp "$VARS_TEMPLATE" build/uefi-vars.fd
          set +e
          timeout 35s qemu-system-aarch64 \
            -machine virt -cpu cortex-a72 -m 1024 \
            -drive if=pflash,unit=0,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,unit=1,format=raw,file=build/uefi-vars.fd \
            -device ramfb -device qemu-xhci -device usb-kbd -device usb-tablet \
            -cdrom build/astraos-aarch64.iso -boot order=d \
            -display none -serial file:build/qemu-serial.log -monitor none \
            > build/qemu-launch.log 2>&1
          QEMU_STATUS=$?
          set -e
          cat build/qemu-launch.log
          cat build/qemu-serial.log || true
          # Timeout is expected: the kernel shell remains active after boot.
          if ! grep -q "AstraOS 0.2.0" build/qemu-serial.log; then
            echo "AstraOS kernel startup marker not found in QEMU serial output (exit $QEMU_STATUS)." >&2
            exit 1
          fi
          if ! grep -q "Kernel entry reached" build/qemu-serial.log; then
            echo "Kernel handoff marker not found in QEMU serial output." >&2
            exit 1
          fi
          echo "AstraOS kernel boot marker verified."

      - name: Upload live images
        uses: actions/upload-artifact@v4
        with:
          name: astraos-aarch64-live
          path: |
            build/astraos-aarch64.iso
            build/astraos-aarch64-esp.img
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling development prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view rolling --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create rolling --repo "$GITHUB_REPOSITORY" \
              --title "AstraOS ARM64 Live (latest CI build)" \
              --notes "Automatically built development images. Not a stable release." \
              --prerelease
          gh release upload rolling \
            build/astraos-aarch64.iso build/astraos-aarch64-esp.img build/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
