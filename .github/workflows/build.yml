name: Build AstraOS ARM64 Live Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  create:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Branch creation is used to request a versioned release. Ignore unrelated branches.
    if: github.event_name != 'create' || startsWith(github.ref, 'refs/heads/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install compiler, ISO, and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld xorriso dosfstools mtools qemu-system-arm qemu-efi-aarch64 file python3 xvfb xdotool

      - name: Run sanitizer tests and build the native kernel and images
        run: bash ./scripts/build.sh

      - name: Inspect kernel, bootloader, ISO, and checksums
        run: |
          file build/kernel.elf
          file build/kernel.bin
          file build/EFI/BOOT/BOOTAA64.EFI
          xorriso -indev build/astraos-aarch64-virt.iso -report_el_torito as_mkisofs
          test -s build/astraos-aarch64.iso
          test -s build/astraos-aarch64-esp.img
          test -s build/astraos-aarch64-virt.iso
          test -s build/astraos-aarch64-virt-esp.img
          test -s build/astraos-aarch64-keyboard.iso
          test -s build/astraos-aarch64-keyboard-esp.img
          test -s build/astraos-aarch64-desktop.iso
          test -s build/astraos-aarch64-desktop-esp.img
          (cd build && sha256sum -c SHA256SUMS)
          mdir -i build/astraos-aarch64-virt-esp.img ::/EFI/BOOT
          mdir -i build/astraos-aarch64-virt-esp.img ::/
          mdir -i build/astraos-aarch64-esp.img ::/keyboard-console.cfg
          mdir -i build/astraos-aarch64-keyboard-esp.img ::/keyboard-console.cfg
          mdir -i build/astraos-aarch64-desktop-esp.img ::/keyboard-console.cfg
          mdir -i build/astraos-aarch64-desktop-esp.img ::/desktop-mode.cfg

      - name: Smoke-test kernel boot through UEFI in QEMU
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(find /usr/share -name 'AAVMF_CODE.fd' -print -quit)"
          VARS_TEMPLATE="$(find /usr/share -name 'AAVMF_VARS.fd' -print -quit)"
          if [[ -z "$CODE" || -z "$VARS_TEMPLATE" ]]; then
            echo "Could not find AArch64 UEFI firmware files." >&2
            find /usr/share \( -iname '*AAVMF*' -o -iname '*QEMU_EFI*' \) -print | head -50
            exit 1
          fi
          cp "$VARS_TEMPLATE" build/uefi-vars.fd
          set +e
          timeout 35s qemu-system-aarch64 \
            -machine virt -cpu cortex-a72 -m 1024 \
            -device ramfb \
            -drive if=pflash,unit=0,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,unit=1,format=raw,file=build/uefi-vars.fd \
            -cdrom build/astraos-aarch64-virt.iso -boot order=d \
            -display none -serial file:build/qemu-serial.log -monitor none \
            > build/qemu-launch.log 2>&1
          QEMU_STATUS=$?
          set -e
          cat build/qemu-launch.log
          cat build/qemu-serial.log || true
          # The shell is interactive and intentionally remains alive until timeout.
          if ! grep -q "AstraOS kernel 0.2.0" build/qemu-serial.log; then
            echo "AstraOS kernel startup marker not found (QEMU exit $QEMU_STATUS)." >&2
            exit 1
          fi
          if ! grep -q "UEFI boot-services handoff completed" build/qemu-serial.log; then
            echo "Kernel did not report its UEFI handoff." >&2
            exit 1
          fi
          if ! grep -q "root@astra:/#" build/qemu-serial.log; then
            echo "Kernel did not reach the interactive root shell." >&2
            exit 1
          fi
          if grep -q "Kernel base: 0x0000000040200000" build/qemu-serial.log; then
            echo "QEMU placed the flat kernel at its link address; relocation test was inconclusive." >&2
            exit 1
          fi
          echo "AstraOS kernel booted away from its link address and reached the shell."

      - name: Smoke-test UEFI keyboard input through QEMU
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(find /usr/share -name 'AAVMF_CODE.fd' -print -quit)"
          VARS_TEMPLATE="$(find /usr/share -name 'AAVMF_VARS.fd' -print -quit)"
          if [[ -z "$CODE" || -z "$VARS_TEMPLATE" ]]; then
            echo "Could not find AArch64 UEFI firmware files." >&2
            exit 1
          fi
          cp "$VARS_TEMPLATE" build/uefi-keyboard-vars.fd
          rm -f build/qmp-keyboard.sock build/qemu-keyboard-serial.log build/qemu-keyboard-launch.log
          qemu-system-aarch64 \
            -machine virt -cpu cortex-a72 -m 1024 \
            -device ramfb -device qemu-xhci -device usb-kbd \
            -drive if=pflash,unit=0,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,unit=1,format=raw,file=build/uefi-keyboard-vars.fd \
            -cdrom build/astraos-aarch64-keyboard.iso -boot order=d \
            -display none -serial file:build/qemu-keyboard-serial.log -monitor none \
            -qmp unix:build/qmp-keyboard.sock,server=on,wait=off \
            > build/qemu-keyboard-launch.log 2>&1 &
          QEMU_PID=$!
          cleanup() {
            kill "$QEMU_PID" 2>/dev/null || true
            wait "$QEMU_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          python3 tests/qemu_keyboard_smoke.py build/qmp-keyboard.sock build/qemu-keyboard-serial.log
          cleanup
          trap - EXIT
          cat build/qemu-keyboard-launch.log
          cat build/qemu-keyboard-serial.log

      - name: Smoke-test graphical desktop and compositor in QEMU
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" bash -s <<'DESKTOP_TEST'
          set -euo pipefail
          CODE="$(find /usr/share -name 'AAVMF_CODE.fd' -print -quit)"
          VARS_TEMPLATE="$(find /usr/share -name 'AAVMF_VARS.fd' -print -quit)"
          if [[ -z "$CODE" || -z "$VARS_TEMPLATE" ]]; then
            echo "Could not find AArch64 UEFI firmware files." >&2
            exit 1
          fi
          cp "$VARS_TEMPLATE" build/uefi-desktop-vars.fd
          rm -f build/qmp-desktop.sock build/qemu-desktop-serial.log build/qemu-desktop-launch.log
          qemu-system-aarch64 \
            -machine virt -cpu cortex-a72 -m 1024 \
            -device ramfb -device qemu-xhci -device usb-kbd -device usb-tablet \
            -drive if=pflash,unit=0,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,unit=1,format=raw,file=build/uefi-desktop-vars.fd \
            -cdrom build/astraos-aarch64-desktop.iso -boot order=d \
            -display gtk,show-menubar=off -serial file:build/qemu-desktop-serial.log -monitor none \
            -qmp unix:build/qmp-desktop.sock,server=on,wait=off \
            > build/qemu-desktop-launch.log 2>&1 &
          QEMU_PID=$!
          cleanup() {
            kill "$QEMU_PID" 2>/dev/null || true
            wait "$QEMU_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          python3 tests/qemu_desktop_smoke.py build/qmp-desktop.sock build/qemu-desktop-serial.log build/qemu-desktop-screen.ppm
          cleanup
          trap - EXIT
          cat build/qemu-desktop-launch.log
          cat build/qemu-desktop-serial.log
          DESKTOP_TEST

      - name: Upload live images and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: astraos-aarch64-live
          path: |
            build/astraos-aarch64.iso
            build/astraos-aarch64-esp.img
            build/astraos-aarch64-virt.iso
            build/astraos-aarch64-virt-esp.img
            build/astraos-aarch64-keyboard.iso
            build/astraos-aarch64-keyboard-esp.img
            build/astraos-aarch64-desktop.iso
            build/astraos-aarch64-desktop-esp.img
            build/kernel.elf
            build/kernel.bin
            build/SHA256SUMS
            build/qemu-serial.log
            build/qemu-launch.log
            build/qemu-keyboard-serial.log
            build/qemu-keyboard-launch.log
            build/qemu-desktop-serial.log
            build/qemu-desktop-launch.log
            build/qemu-desktop-screen.ppm
          if-no-files-found: error
          retention-days: 30

      # A versioned build refreshes rolling first. The official release step below
      # only runs after this upload succeeds, so prerelease and official assets cannot race.
      - name: Publish rolling development prerelease
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           (github.event_name == 'create' && startsWith(github.ref, 'refs/heads/v')) ||
           (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prereleases cannot be marked as GitHub's "latest" release. Recreate
          # rolling after all tests pass so its published date and tag track this
          # tested build, keeping it at the top of the Releases list.
          TARGET_SHA="$(git rev-parse HEAD)"
          if gh release view rolling --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete rolling --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create rolling \
            build/astraos-aarch64.iso build/astraos-aarch64-esp.img \
            build/astraos-aarch64-virt.iso build/astraos-aarch64-virt-esp.img \
            build/astraos-aarch64-keyboard.iso build/astraos-aarch64-keyboard-esp.img \
            build/astraos-aarch64-desktop.iso build/astraos-aarch64-desktop-esp.img \
            build/kernel.elf build/kernel.bin build/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "AstraOS ARM64 Live (latest CI build)" \
            --notes "Automatically built development images. Not a stable release." \
            --prerelease

      - name: Publish official versioned alpha release
        if: (github.event_name == 'create' && startsWith(github.ref, 'refs/heads/v')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$GITHUB_REF_NAME"
          TARGET_SHA="$(git rev-parse HEAD)"
          gh release create "$VERSION" \
            build/astraos-aarch64.iso build/astraos-aarch64-esp.img \
            build/astraos-aarch64-virt.iso build/astraos-aarch64-virt-esp.img \
            build/astraos-aarch64-keyboard.iso build/astraos-aarch64-keyboard-esp.img \
            build/astraos-aarch64-desktop.iso build/astraos-aarch64-desktop-esp.img \
            build/kernel.elf build/kernel.bin build/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "AstraOS ${VERSION} — Alpha" \
            --notes "Official versioned AstraOS alpha release.

          This release packages the freestanding AArch64 kernel and UEFI live images. CI runs sanitizer-backed parser and kernel tests, validates the generated images and checksums, and smoke-tests UEFI boot to the interactive shell in QEMU.

          **Alpha limitations:** AstraOS remains experimental and is currently validated against QEMU's AArch64 `virt` machine. A passing QEMU test does not imply support for physical laptops or phones. It is not a secure multi-user OS, has no persistent storage or process isolation, and must not be installed over an existing operating system or used to protect data.

          See the repository README for build instructions, image descriptions, boot steps, and current limitations." \
            --latest
