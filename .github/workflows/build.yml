name: Build AstraOS ARM64 Live Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astraos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld xorriso dosfstools mtools qemu-system-arm qemu-efi-aarch64 file

      - name: Run sanitizer-backed shell regression tests
        run: |
          clang -std=c17 -fshort-wchar -g -O0 \
            -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wformat=2 \
            -Wstrict-prototypes -Wmissing-prototypes -Wwrite-strings \
            -Wcast-qual -Wundef -Wvla -Werror \
            -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            -fno-omit-frame-pointer \
            tests/uefi_shell_tests.c -o /tmp/astraos-shell-tests
          UBSAN_OPTIONS=print_stacktrace=1 /tmp/astraos-shell-tests

      - name: Run kernel VFS sanitizer tests
        run: |
          clang -std=c17 -g -O0 \
            -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wformat=2 \
            -Wstrict-prototypes -Wmissing-prototypes -Wwrite-strings \
            -Wcast-qual -Wundef -Wvla -Werror \
            -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            -fno-omit-frame-pointer -Ikernel \
            kernel/vfs.c tests/vfs_tests.c -o /tmp/astraos-vfs-tests
          UBSAN_OPTIONS=print_stacktrace=1 /tmp/astraos-vfs-tests

      - name: Run physical-memory allocator sanitizer tests
        run: |
          clang -std=c17 -g -O0 \
            -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wformat=2 \
            -Wstrict-prototypes -Wmissing-prototypes -Wwrite-strings \
            -Wcast-qual -Wundef -Wvla -Werror \
            -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            -fno-omit-frame-pointer -Ikernel \
            kernel/memory.c tests/memory_tests.c -o /tmp/astraos-memory-tests
          UBSAN_OPTIONS=print_stacktrace=1 /tmp/astraos-memory-tests

      - name: Run GOP framebuffer sanitizer tests
        run: |
          clang -std=c17 -g -O0 \
            -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wformat=2 \
            -Wstrict-prototypes -Wmissing-prototypes -Wwrite-strings \
            -Wcast-qual -Wundef -Wvla -Werror \
            -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            -fno-omit-frame-pointer -Ikernel \
            kernel/framebuffer.c tests/framebuffer_tests.c -o /tmp/astraos-framebuffer-tests
          UBSAN_OPTIONS=print_stacktrace=1 /tmp/astraos-framebuffer-tests

      - name: Run FDT parser sanitizer tests
        run: |
          clang -std=c17 -g -O0 \
            -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wformat=2 \
            -Wstrict-prototypes -Wmissing-prototypes -Wwrite-strings \
            -Wcast-qual -Wundef -Wvla -Werror \
            -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            -fno-omit-frame-pointer -Ikernel \
            kernel/fdt.c tests/fdt_tests.c -o /tmp/astraos-fdt-tests
          UBSAN_OPTIONS=print_stacktrace=1 /tmp/astraos-fdt-tests

      - name: Build ARM64 UEFI application and ISO
        run: bash ./scripts/build.sh

      - name: Inspect firmware application and kernel
        run: |
          file build/EFI/BOOT/BOOTAA64.EFI
          file build/kernel.elf
          nm -u build/kernel.elf
          xorriso -indev build/astraos-aarch64.iso -report_el_torito as_mkisofs
          test -s build/astraos-aarch64.iso
          test -s build/astraos-aarch64-esp.img
          test -s build/kernel.bin

      - name: Smoke-test UEFI boot and kernel shell in QEMU
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(find /usr/share -name 'AAVMF_CODE.fd' -print -quit)"
          VARS_TEMPLATE="$(find /usr/share -name 'AAVMF_VARS.fd' -print -quit)"
          if [[ -z "$CODE" || -z "$VARS_TEMPLATE" ]]; then
            echo "Could not find AArch64 UEFI firmware package files." >&2
            exit 1
          fi
          cp "$VARS_TEMPLATE" build/uefi-vars.fd
          set +e
          {
            # Wait for the kernel prompt, then inject commands slowly enough for a UART FIFO.
            sleep 8
            commands='help|platform|whoami|mkdir /tmp/ci|touch /tmp/ci/probe|write /tmp/ci/probe kernel-vfs-ok|cat /tmp/ci/probe|'
            for ((i = 0; i < ${#commands}; i++)); do
              char="${commands:i:1}"
              if [[ "$char" == "|" ]]; then
                printf '%b' '\015'
              else
                printf '%s' "$char"
              fi
              sleep 0.01
            done
            sleep 2
          } | timeout 35s qemu-system-aarch64 \
            -machine virt -cpu cortex-a72 -m 1024 \
            -drive if=pflash,format=raw,unit=0,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,unit=1,file=build/uefi-vars.fd \
            -cdrom build/astraos-aarch64.iso -boot order=d \
            -display none -serial stdio -monitor none \
            > build/qemu-boot.log 2>&1
          QEMU_STATUS=$?
          set -e
          cat build/qemu-boot.log
          # The interactive live shell intentionally keeps running. Timeout is expected.
          if ! grep -q "AstraOS kernel 0.2" build/qemu-boot.log; then
            echo "AstraOS kernel startup marker not found in QEMU console log (exit $QEMU_STATUS)." >&2
            exit 1
          fi
          if grep -q "Kernel base: 0x0000000040200000" build/qemu-boot.log; then
            echo "UEFI loaded the kernel at its link address; relocation was not exercised." >&2
            exit 1
          fi
          if ! grep -q "root@astra:/#" build/qemu-boot.log; then
            echo "Kernel did not reach the interactive root prompt." >&2
            exit 1
          fi
          if ! grep -q "Platform diagnostics:" build/qemu-boot.log; then
            echo "The platform shell command did not run." >&2
            exit 1
          fi
          if ! grep -q "directory created" build/qemu-boot.log; then
            echo "Kernel shell did not create the test directory." >&2
            exit 1
          fi
          if ! grep -q "written" build/qemu-boot.log; then
            echo "Kernel shell did not complete the file write." >&2
            exit 1
          fi
          if ! tr -d '\r' < build/qemu-boot.log | grep -qx "kernel-vfs-ok"; then
            echo "Kernel shell did not read back the exact file content." >&2
            exit 1
          fi
          if ! tr -d '\r' < build/qemu-boot.log | grep -qx "root"; then
            echo "whoami command did not return the root identity." >&2
            exit 1
          fi
          echo "AstraOS boot, root prompt, identity, and create/write/read behavior verified."

      - name: Smoke-test optional GOP framebuffer and serial fallback
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(find /usr/share -name 'AAVMF_CODE.fd' -print -quit)"
          VARS_TEMPLATE="$(find /usr/share -name 'AAVMF_VARS.fd' -print -quit)"
          if [[ -z "$CODE" || -z "$VARS_TEMPLATE" ]]; then
            echo "Could not find AArch64 UEFI firmware files." >&2
            exit 1
          fi
          cp "$VARS_TEMPLATE" build/uefi-gop-vars.fd
          set +e
          timeout 20s qemu-system-aarch64 \
            -machine virt -cpu cortex-a72 -m 1024 \
            -device ramfb \
            -drive if=pflash,format=raw,unit=0,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,unit=1,file=build/uefi-gop-vars.fd \
            -cdrom build/astraos-aarch64.iso -boot order=d \
            -display none -serial stdio -monitor none \
            > build/qemu-gop.log 2>&1
          QEMU_STATUS=$?
          set -e
          cat build/qemu-gop.log
          if ! grep -q "AstraOS kernel 0.2" build/qemu-gop.log; then
            echo "AstraOS did not boot in the GOP/fallback smoke test (exit $QEMU_STATUS)." >&2
            exit 1
          fi
          if ! grep -q "root@astra:/#" build/qemu-gop.log; then
            echo "AstraOS did not reach its shell prompt in the GOP/fallback smoke test." >&2
            exit 1
          fi
          if grep -q "GOP framebuffer console active" build/qemu-gop.log; then
            echo "GOP framebuffer activated and the kernel continued booting."
          elif grep -q "GOP framebuffer console unavailable; serial remains active." build/qemu-gop.log; then
            echo "This AAVMF configuration exposes no usable GOP; serial fallback verified."
          else
            echo "Neither a usable GOP console nor the expected serial fallback was reported." >&2
            exit 1
          fi

      - name: Upload ISO and kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astraos-aarch64-live
          path: |
            build/astraos-aarch64.iso
            build/astraos-aarch64-esp.img
            build/SHA256SUMS
            build/kernel.elf
            build/kernel.bin
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling prerelease assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view rolling --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create rolling --repo "$GITHUB_REPOSITORY" \
              --title "AstraOS ARM64 Live (latest CI build)" \
              --notes "Automatically built development image. Not a stable release." \
              --prerelease
          gh release upload rolling \
            build/astraos-aarch64.iso build/astraos-aarch64-esp.img \
            build/kernel.elf build/kernel.bin build/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
